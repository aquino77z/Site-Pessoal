<!DOCTYPE html> 
<html lang="pt-br"> 
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="site-header">
        <button id="theme-toggle" class="theme-btn btn btn-outline-primary btn-sm">Alternar Tema</button>
        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
        <h1>Formulário de Contato</h1>
    </header>
    
    <main class="form-grid">
        <div class="cartao">
            <form> 
                <div id="form-feedback" class="feedback-message"></div>
                <fieldset> 
                    <legend>Dados pessoais</legend> 
                    
                    <label for="nome" class="form-label">Nome:</label> 
                    <input type="text" id="nome" class="form-control mb-2" required> 
                    
                    <label for="email" class="form-label">E-mail:</label> 
                    <input type="email" id="email" class="form-control mb-2" required>
                    
                    <label for="assunto" class="form-label">Assunto:</label>
                    <input type="text" id="assunto" class="form-control mb-2" required>
                    
                    <label for="mensagem" class="form-label">Mensagem:</label>
                    <textarea id="mensagem" class="form-control mb-2" required></textarea>
                    
                    <label for="tel" class="form-label">Telefone:</label> 
                    <input type="tel" id="tel" class="form-control mb-2" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"> 
                    
                    <label for="nasc" class="form-label">Nascimento:</label> 
                    <input type="date" id="nasc" class="form-control mb-2"> 
                    
                    <label for="senha" class="form-label">Senha:</label> 
                    <input type="password" id="senha" class="form-control mb-2" required minlength="8"> 
                </fieldset> 
                <button type="submit" class="btn btn-primary mt-2">Enviar</button> 
            </form> 
        </div>
    </main>

    <footer style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #777;">
        <p><em>Feito por Gabriel de Aquino — 2026</em></p>
    </footer>
    <script src="js/scripts.js"></script>
</body> 
</html>
